      <stop offset=".42" stop-color="#f0c56d"/>
      <stop offset="1" stop-color="#bf7b35"/>
    </radialGradient>
    <radialGradient id="soft-light">
      <stop offset="0" stop-color="#edbd63" stop-opacity=".56"/>
      <stop offset="1" stop-color="#edbd63" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="cell-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

