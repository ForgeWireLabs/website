  <title id="masthead-title">ForgeWire Labs — Independent engineering and applied AI</title>
  <desc id="masthead-description">A blue neural cell and branching processes frame the ForgeWire Labs wordmark on a warm ivory background, with restrained amber contact points.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf5e7"/>
      <stop offset=".5" stop-color="#f0f2e9"/>
      <stop offset="1" stop-color="#dce9e7"/>
    </linearGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#347e89"/>
      <stop offset=".48" stop-color="#15576b"/>
      <stop offset="1" stop-color="#0c354b"/>
    </linearGradient>
    <linearGradient id="fiber-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b2b5"/>
      <stop offset=".55" stop-color="#357e8b"/>
      <stop offset="1" stop-color="#165368"/>
    </linearGradient>
    <radialGradient id="soma" cx="38%" cy="28%" r="76%">
